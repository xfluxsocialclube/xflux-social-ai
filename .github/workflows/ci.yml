name: XFLUX Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar NSIS
        run: choco install nsis --yes --no-progress

      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund

      - name: Compilar instalador Windows
        run: npm run tauri:build

      - name: Guardar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: XFLUX-Social-AI-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar instalador para download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: XFLUX Social AI — instalador Windows ${{ github.run_number }}
          prerelease: true
          make_latest: true
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
