name: XFLUX build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar tipos e compilar
        run: npm run build
      - name: Guardar versão compilada
        uses: actions/upload-artifact@v4
        with:
          name: xflux-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
