name: XFLUX Windows installer

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xflux-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar NSIS
        run: choco install nsis --yes --no-progress

      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund

      - name: Gerar ícones do aplicativo
        run: npm run tauri -- icon src-tauri/icons/xflux-icon.svg

      - name: Compilar instalador Windows
        shell: pwsh
        env:
          VITE_XFLUX_API_URL: ${{ vars.VITE_XFLUX_API_URL }}
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Tentativa $attempt de 3 para gerar o instalador NSIS"
            & npm run tauri:build
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 3) {
              Write-Warning "A compilação falhou. Nova tentativa em $($attempt * 15) segundos."
              Start-Sleep -Seconds ($attempt * 15)
            }
          }
          exit 1

      - name: Guardar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: XFLUX-Social-AI-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar instalador para download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: XFLUX Social AI — instalador Windows ${{ github.run_number }}
          prerelease: true
          make_latest: true
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências do backend
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Testar contrato e bloqueios de segurança
        working-directory: backend
        run: python -m pytest -q
