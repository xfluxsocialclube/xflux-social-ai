name = "xflux-social-ai"
main = "src/index.ts"
compatibility_date = "2026-11-15"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "xflux-meta-auth"
database_id = "11d4d42e-ab1d-4864-82c3-4d3975f672a2"

[vars]
META_GRAPH_VERSION = "v27.0"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
