openapi: 3.0.3
info:
  title: XFLUX Backend (contrato v1)
  version: "1"
  description: >
    Contrato entre o aplicativo XFLUX e o servidor central. O servidor guarda segredos e tokens das redes;
    o aplicativo recebe apenas o estado das contas. Endpoints marcados x-status "planned" ainda não são usados pelo aplicativo.
servers:
  - url: https://api.exemplo.com
security:
  - sessionBearer: []
paths:
  /v1/health:
    get:
      operationId: health
      x-status: used
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /v1/accounts:
    get:
      operationId: listAccounts
      x-status: used
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Accounts" } } } }
        "401": { description: Não autorizado }
  /v1/accounts/{id}:
    delete:
      operationId: disconnectAccount
      x-status: used
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: Autorização revogada e apagada }
  /v1/oauth/{network}/start:
    post:
      operationId: startOAuth
      x-status: used
      parameters: [ { name: network, in: path, required: true, schema: { type: string, enum: [instagram, facebook, tiktok, shopee, pinterest, youtube] } } ]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { reconnectAccountId: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OAuthStart" } } } }
  /v1/uploads:
    post:
      operationId: createUpload
      x-status: planned
      responses: { "201": { description: Upload retomável criado (devolve mediaRef) } }
  /v1/publications/{clientPostId}:
    parameters: [ { name: clientPostId, in: path, required: true, schema: { type: string } } ]
    put:
      operationId: upsertPublication
      x-status: planned
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PublicationJob" } } }
      responses: { "200": { description: Job criado ou atualizado (idempotente) } }
    get:
      operationId: getPublication
      x-status: planned
      responses: { "200": { description: Estado e tentativas, content: { application/json: { schema: { $ref: "#/components/schemas/PublicationStatus" } } } } }
    delete:
      operationId: cancelPublication
      x-status: planned
      responses: { "204": { description: Cancelado } }
components:
  securitySchemes:
    sessionBearer: { type: http, scheme: bearer, description: Chave de sessão do XFLUX (não é token de rede social) }
  schemas:
    Health:
      type: object
      required: [service, apiVersion, capabilities, providers]
      properties:
        service: { type: string, enum: [xflux-backend] }
        apiVersion: { type: string, enum: ["1"] }
        capabilities: { type: array, items: { type: string, enum: [accounts, oauth, publishing, scheduler] } }
        providers:
          type: array
          items: { type: object, required: [network, oauth, publishing], properties: { network: { type: string }, oauth: { type: boolean }, publishing: { type: boolean } } }
    Account:
      type: object
      required: [id, network, displayName, state, scopes, connectedAt, lastCheckedAt]
      properties:
        id: { type: string }
        network: { type: string }
        displayName: { type: string }
        state: { type: string, enum: [connected, expired, revoked, error] }
        scopes: { type: array, items: { type: string } }
        connectedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastCheckedAt: { type: string, format: date-time }
        lastError: { type: object, properties: { code: { type: string }, message: { type: string } } }
    Accounts:
      type: object
      required: [accounts]
      properties: { accounts: { type: array, items: { $ref: "#/components/schemas/Account" } } }
    OAuthStart:
      type: object
      required: [authorizationUrl, expiresInSeconds]
      properties: { authorizationUrl: { type: string, format: uri, description: Sempre https }, expiresInSeconds: { type: integer } }
    PublicationJob:
      type: object
      required: [network, accountId, mediaRef, scheduledAtUtc, timeZone]
      properties:
        network: { type: string }
        accountId: { type: string }
        mediaRef: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        scheduledAtUtc: { type: string, format: date-time }
        timeZone: { type: string, description: Nome IANA, ex. America/Sao_Paulo }
    PublicationStatus:
      type: object
      properties:
        state: { type: string, enum: [queued, processing, published, failed] }
        confirmedBy: { type: string, enum: [platform] }
        externalId: { type: string }
        errorCode: { type: string }
        attempts: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, outcome: { type: string }, errorCode: { type: string } } } }
