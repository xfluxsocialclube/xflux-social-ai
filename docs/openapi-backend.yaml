openapi: 3.0.3
info:
  title: XFLUX Backend (contrato implementado v1)
  version: "1"
  description: >
    Estado real do protótipo. A autenticação Bearer atual usa uma chave compartilhada temporária;
    ainda não existe identidade multiusuário. OAuth e publicação estão desativados.
servers:
  - url: https://api.example.invalid
security: []
paths:
  /v1/health:
    get:
      operationId: health
      summary: Capacidades realmente disponíveis
      responses:
        "200":
          description: Estado do backend; OAuth e publicação permanecem desativados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/accounts:
    get:
      operationId: listAccounts
      summary: Lista metadados locais (sem isolamento multiusuário)
      security:
        - sessionBearer: []
      responses:
        "200":
          description: Metadados das contas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accounts"
        "401":
          description: Sessão ausente ou incorreta
        "503":
          description: Segredo ausente ou configuração de produção insegura
  /v1/accounts/{account_id}:
    delete:
      operationId: deleteAccountMetadata
      summary: Apaga metadados locais; não revoga na plataforma
      security:
        - sessionBearer: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Metadados locais apagados
        "401":
          description: Sessão ausente ou incorreta
        "503":
          description: Configuração segura indisponível
  /v1/oauth/{network}/start:
    post:
      operationId: startOAuth
      summary: Bloqueado até implementação OAuth real
      security:
        - sessionBearer: []
      parameters:
        - name: network
          in: path
          required: true
          schema:
            type: string
            enum: [instagram, facebook, tiktok, shopee, pinterest, youtube]
      responses:
        "503":
          description: OAuth ainda não configurado; nenhuma autorização foi iniciada
        "401":
          description: Sessão ausente ou incorreta
        "404":
          description: Rede desconhecida
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      description: Chave temporária compartilhada do XFLUX; não é token de rede social nem login multiusuário.
  schemas:
    Health:
      type: object
      required: [service, apiVersion, capabilities, providers]
      properties:
        service:
          type: string
          enum: [xflux-backend]
        apiVersion:
          type: string
          enum: ["1"]
        capabilities:
          type: array
          items:
            type: string
            enum: [accounts]
        providers:
          type: array
          items:
            type: object
            required: [network, oauth, publishing]
            properties:
              network:
                type: string
              oauth:
                type: boolean
                enum: [false]
              publishing:
                type: boolean
                enum: [false]
    Account:
      type: object
      required: [id, network, displayName, state, scopes, connectedAt, lastCheckedAt]
      properties:
        id:
          type: string
        network:
          type: string
        displayName:
          type: string
        state:
          type: string
          enum: [connected, expired, revoked, error]
        scopes:
          type: array
          items:
            type: string
        connectedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
        lastError:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Accounts:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
